<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="2100" viewBox="0 0 1050 2100" text-rendering="geometricPrecision" font-family="sans-serif">
<defs>
  <filter id="shadow-5" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.26"/>
  </filter>
  <filter id="shadow-11" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="5.5" stdDeviation="6.6" flood-color="#000000" flood-opacity="0.26"/>
  </filter>
</defs>
<g transform="translate(0, 0)">
  <g id="Root">
